name: the_fresh_yard
description: "The Fresh Yard - Fresh organic groceries delivered to your door."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  lottie: ^3.5.1
  flutter_svg: ^2.3.0
  http: ^1.6.0
  cached_network_image: 3.3.1
  shimmer: ^3.0.0
  shared_preferences: 2.0.15
  flutter_animate: ^4.5.2
  path_drawing: ^1.0.1
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  path_provider: 2.0.15
  path_provider_foundation: 2.1.1
  path_provider_android: 2.2.15

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/the_fresh_yard_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D2818"
  adaptive_icon_foreground: "assets/images/the_fresh_yard_logo.png"

flutter_native_splash:
  color: "#0D2818"
  image: assets/images/the_fresh_yard_logo.png
  android_12:
    color: "#0D2818"
    image: assets/images/the_fresh_yard_logo.png
  ios: true
  android: true
